<!DOCTYPE html>
<html>
<head>
    <title>Project Showcase</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
        .status { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        .running .dot { background: #22c55e; }
        .stopped .dot { background: #9ca3af; }
        .badge { display: inline-block; background: #f3f4f6; border-radius: 6px; padding: 4px 10px; font-size: 13px; margin-right: 6px; }
        .actions { margin-top: 24px; display: flex; gap: 12px; }
        .btn { padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; }
        .btn-primary { background: #111827; color: white; }
        .btn-secondary { background: #f3f4f6; color: #111827; }
        h1 { margin-bottom: 4px; }
    </style>
</head>
<body>
<div id="content">Loading...</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('projectId');

    if (!projectId) {
        document.getElementById('content').innerText = 'Missing ?projectId= in URL';
    } else {
        fetch(`/api/projects/${projectId}/showcase`)
            .then(r => {
                if (!r.ok) throw new Error('Project not found');
                return r.json();
            })
            .then(project => {
                const statusClass = project.isRunning ? 'running' : 'stopped';
                document.getElementById('content').innerHTML = `
                        <h1>${project.name}</h1>
                        <div class="status ${statusClass}"><span class="dot"></span> ${project.status}</div>
                        <div style="margin-top: 16px;">
                            <span class="badge">${project.buildTool}</span>
                            <span class="badge">Java ${project.javaVersion}</span>
                        </div>
                        <div class="actions">
                            <a class="btn btn-primary" href="/explorer.html?projectId=${project.id}">Explore API</a>
                            <a class="btn btn-secondary" href="${project.githubRepoUrl}" target="_blank">GitHub</a>
                        </div>
                    `;
            })
            .catch(() => {
                document.getElementById('content').innerText = 'Project not found.';
            });
    }
</script>
</body>
</html>
