spring.application.name=platform-backend
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/showcase_platform
spring.datasource.username=showcase_user
spring.datasource.password=${DB_PASSWORD:devpassword}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.profiles.include=local

# Where /auth/callback sends the browser after a successful login. Defaults to the app root
# (correct once the built frontend is copied into src/main/resources/static for production).
# Override to http://localhost:5173/ in application-local.properties during `npm run dev`.
app.oauth.post-login-redirect=/

# Without this, Spring's default error handler strips the "message" field from any exception
# that isn't explicitly mapped in GlobalExceptionHandler (e.g. RunController's IllegalStateException
# for "not built yet" / the delete-confirmation IllegalArgumentException), so the dashboard would
# get a generic body with no usable text for those cases. The messages thrown in this codebase are
# already hand-written user-facing strings, not stack traces, so this is safe to expose.
server.error.include-message=always