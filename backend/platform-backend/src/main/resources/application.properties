spring.application.name=platform-backend
server.port=8090

spring.datasource.url=jdbc:postgresql://localhost:5432/showcase_platform
spring.datasource.username=showcase_user
spring.datasource.password=${DB_PASSWORD:devpassword}

# --- MySQL provisioning (see DatabaseProvisionerService.provisionMySqlDatabase) ---
# Only needed if you plan to build/run MySQL-based projects. Points at an ADMIN account on your
# local MySQL server that can CREATE/DROP databases and users — analogous to the Postgres
# superuser config above. Leave unset if you don't have MySQL installed locally; provisioning will
# just fail clearly for any MySQL-detected project instead of silently doing nothing.
# spring.datasource.mysql.url=jdbc:mysql://localhost:3306/
# spring.datasource.mysql.username=root
# spring.datasource.mysql.password=<your local MySQL root password — put the REAL value in
#                                    application-local.properties, never here>

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.profiles.include=local

# Where /auth/callback sends the browser after a successful login. Defaults to the app root
# (correct once the built frontend is copied into src/main/resources/static for production).
# Override to http://localhost:5173/ in application-local.properties during `npm run dev`.
app.oauth.post-login-redirect=/

# Without this, Spring's default error handler strips the "message" field from any exception
# that isn't explicitly mapped in GlobalExceptionHandler (e.g. RunController's IllegalStateException
# for "not built yet" / the delete-confirmation IllegalArgumentException), so the dashboard would
# get a generic body with no usable text for those cases. The messages thrown in this codebase are
# already hand-written user-facing strings, not stack traces, so this is safe to expose.
server.error.include-message=always

# --- Rate limiting (see config/RateLimitFilter, RateLimitStore) ---
# Which store backs the rate-limit counters: "memory" (default, per-JVM, current behavior) or
# "redis" (shared across instances — needs spring.data.redis.host/port below to point at a real
# Redis, and hasn't been exercised against one yet; verify before relying on it in production).
app.ratelimit.store=memory

# Per-rule overrides. Uncomment/add any of these to tune a rule's limit or window without a code
# change or recompile. Unset rules keep RateLimitFilter's built-in defaults (10-120 req/min).
# app.ratelimit.rules.auth-login.limit=10
# app.ratelimit.rules.auth-login.window-seconds=60
# app.ratelimit.rules.proxy.limit=120
# app.ratelimit.rules.proxy.window-seconds=60

# Only consulted when app.ratelimit.store=redis. Defaults match a local `redis-server` with no
# auth configured; override for anything else (managed Redis, ACL password, non-default port).
# spring.data.redis.host=localhost
# spring.data.redis.port=6379